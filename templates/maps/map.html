{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps</title>
    <link rel="stylesheet" href="{% static 'css/map.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <span>📍</span>
            <h2>Google Maps</h2>
        </div>

        <div class="search">
            <input type="text" placeholder="Search places and addresses">
            <button>🔍</button>
        </div>

        <div class="nav-icons">
            <span>⚙️</span>
            <span>🔔</span>
            <img src="https://i.pravatar.cc/40" alt="Profile">
        </div>
    </nav>

    <!-- Main Section -->
    <div class="main">

        <!-- Left Panel -->
        <aside class="left-panel">

            <h2>Explore nearby</h2>

            <div class="categories">
                <button>☕ Coffee</button>
                <button>🍽️ Restaurants</button>
                <button>🏨 Hotels</button>
                <button>🛍️ Shopping</button>
            </div>

            <div class="place">
                <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300" alt="Restaurant">
                <div>
                    <h3>Popular Restaurant</h3>
                    <p>★★★★☆ 4.5</p>
                    <p>Restaurant · Open now</p>
                </div>
            </div>

            <div class="place">
                <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=300" alt="Cafe">
                <div>
                    <h3>City Coffee Cafe</h3>
                    <p>★★★★★ 4.8</p>
                    <p>Cafe · Open now</p>
                </div>
            </div>

            <div class="place">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=300" alt="Hotel">
                <div>
                    <h3>Grand Hotel</h3>
                    <p>★★★★☆ 4.2</p>
                    <p>Hotel · Open now</p>
                </div>
            </div>

        </aside>

        <!-- Map Area -->
        <section class="map">

            <div class="road road1"></div>
            <div class="road road2"></div>
            <div class="road road3"></div>

            <div class="map-name">BENGALURU</div>

            <div class="marker marker1">📍</div>
            <div class="marker marker2">📍</div>
            <div class="marker marker3">📍</div>

            <div class="map-buttons">
                <button>+</button>
                <button>−</button>
                <button>📍</button>
            </div>

        </section>

    </div>

</body>
</html>
