{% load static %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Photos</title>

    <link rel="stylesheet" href="{% static 'css/photo.css' %}">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <span>🌈</span>
            <h2>Google Photos</h2>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search your photos">
        </div>

        <div class="profile">
            <span>❔</span>
            <span>⚙️</span>
            <img src="https://i.pravatar.cc/40" alt="Profile">
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="backup-btn">☁️ Backup</button>

            <ul>
                <li class="active">🏠 Home</li>
                <li>📷 Photos</li>
                <li>🔍 Explore</li>
                <li>🗂️ Albums</li>
                <li>⭐ Favorites</li>
                <li>🗑️ Archive</li>
                <li>🗑️ Trash</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="content">

            <h1>Photos</h1>
            <p class="subtitle">Your memories, all in one place.</p>

            <h3>Today</h3>

            <!-- Photo Gallery -->
            <div class="gallery">

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Mountain">
                </div>

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise">
                </div>

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake">
                </div>

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Nature">
                </div>

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600" alt="Green field">
                </div>

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest">
                </div>

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beach">
                </div>

                <div class="photo">
                    <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600" alt="Ocean">
                </div>

            </div>

        </main>

    </div>

</body>
</html>
